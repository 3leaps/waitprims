# goneat assess configuration for waitprims
# Rust library. Rust checks (cargo fmt, clippy) stay on the fast CI gate.
# This config handles ancillary files (YAML, GitHub Actions).
#
# NOTE: goneat does not have native Rust support. Do not add
# goneat-tools-runner or GPL tools to this tree.
version: 1
lint:
  # YAML linting (CI workflows, configs)
  yamllint:
    enabled: true
    strict: true
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - ".github/*.yaml"
      - ".goneat/**/*.yaml"
    ignore: []
  # GitHub Actions linting
  github_actions:
    actionlint:
      enabled: true
      paths:
        - ".github/workflows/**/*.yml"
        - ".github/workflows/**/*.yaml"
      ignore: []
