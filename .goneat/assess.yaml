# goneat assess configuration for waitprims
# Rust library. Rust checks (cargo fmt, clippy) stay on the fast CI gate.
# This config handles GitHub Actions. YAML format is yamlfmt (Apache-2.0)
# via .yamlfmt. Do not enable yamllint (GPL-3.0-or-later).
#
# License and cooling policy live in dependencies.yaml (deny.toml is the
# cargo-deny twin). Do not add goneat-tools-runner or GPL tools.
version: 1
lint:
  # GitHub Actions linting (actionlint is MIT)
  github_actions:
    actionlint:
      enabled: true
      paths:
        - ".github/workflows/**/*.yml"
        - ".github/workflows/**/*.yaml"
      ignore: []
