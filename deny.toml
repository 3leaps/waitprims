# waitprims cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# Thin license/source policy aligned with .goneat/dependencies.yaml.
# Permissive licenses only. Do not add GPL/AGPL/LGPL crates.

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "CC0-1.0",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]
exceptions = []

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/3leaps",
  "https://github.com/lanytehq",
  "https://github.com/fulmenhq",
  "https://github.com/birchton",
]

[sources.allow-org]
github = ["3leaps", "lanytehq", "fulmenhq", "birchton"]
