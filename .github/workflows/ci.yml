# waitprims CI
#
# Not one required 5-wide PR gate. The required gate is `fast` on
# ubuntu-latest. Hosted smokes are three cells on every push/PR.
# arm64 labs are two more cells, same-repo only, not required.
# Fork PRs therefore see three native smokes, not five.
#
# Hosted (every push/PR; no cross, no musl, no macOS Intel,
# no goneat-tools-runner):
#   ubuntu-latest              x86_64-unknown-linux-gnu
#   macos-15                   aarch64-apple-darwin
#   windows-latest             x86_64-pc-windows-msvc
# arm64 labs (same-repo only):
#   ubuntu-latest-arm64-s      aarch64-unknown-linux-gnu
#   windows-latest-arm64-s     aarch64-pc-windows-msvc
#
# platform-smoke-arm64 is same-repo only and is not a required gate.
# Custom labels are declared in .github/actionlint.yaml (lint only;
# that file does not deploy a runner).
#
# FakeClock is logical. Same-instant / restore / poll-ack use contract
# timestamps and registration-set order, not wall sleeps. Windows has
# no EINTR, UDS, signal-driven cancel, or Job Object claim; Cancel is
# a watch token.
#
# rustc is workspace MSRV 1.88.0. Pin stays contract: agent-wait/v0 at
# f1912957cde19b2b1e7809e430cc28dc417287cc.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # reviewed 2026-08-05 commit
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          curl -fsSL -o "${RUNNER_TEMP}/actionlint.tgz" "${url}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${RUNNER_TEMP}/actionlint.tgz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/actionlint.tgz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

      - name: Test
        run: cargo test --workspace --locked

      - name: Held-follow demo
        run: make demo-follow

  platform-smoke-hosted:
    name: platform-smoke-hosted (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # reviewed 2026-08-05 commit
        with:
          toolchain: 1.88.0
          components: clippy

      - name: Verify native host
        run: |
          set -euo pipefail
          host=$(rustc -vV | awk '/^host:/{print $2}')
          test "$host" = "${{ matrix.target }}"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # Same-repo only. Not a required PR gate. Fork PRs skip these cells.
  platform-smoke-arm64:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: platform-smoke-arm64 (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest-arm64-s
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest-arm64-s
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # reviewed 2026-08-05 commit
        with:
          toolchain: 1.88.0
          components: clippy

      - name: Verify native host
        run: |
          set -euo pipefail
          host=$(rustc -vV | awk '/^host:/{print $2}')
          test "$host" = "${{ matrix.target }}"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  release-tooling:
    name: Release tooling controls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # reviewed 2026-08-05 commit
        with:
          toolchain: 1.88.0
      - name: Verify tooling prerequisites
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          command -v gpg
          command -v jq
      - name: Install checksum-pinned Decernor for synthetic tests
        run: |
          tool_dir="$(mktemp -d "$RUNNER_TEMP/decernor.XXXXXX")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            'https://github.com/3leaps/decernor/releases/download/v0.1.8/decernor_0.1.8_linux_amd64.tar.gz' \
            --output "$tool_dir/decernor_0.1.8_linux_amd64.tar.gz"
          (cd "$tool_dir" && sha256sum --check "$GITHUB_WORKSPACE/config/release/decernor-ci-sha256.txt")
          tar -xzf "$tool_dir/decernor_0.1.8_linux_amd64.tar.gz" -C "$tool_dir" decernor
          echo "WAITPRIMS_DECERNOR_BIN=$tool_dir/decernor" >> "$GITHUB_ENV"
      - name: Synthetic release regression controls
        run: make release-tooling-test
