# waitprims CI
#
# Five-platform matrix. This crate is a waiter: first-match, poll, restore,
# and poll-ack must run on every OS/arch, not only linux x86_64.
#
# Why the matrix exists:
# - Clock resolution differs. Windows default timer granularity is typically
#   ~15.6ms; macOS and Linux are finer. Same-instant ties, restore, and
#   poll-ack use contract timestamps and registration-set order. Do not use
#   a sub-ms sleep or wall Instant as a uniqueness key.
# - Windows POSIX gaps: no EINTR, no unix domain sockets, no signal-driven
#   cancel. Cancel is a watch token; deadlines use Clock::sleep_until.
#
# Estate runner labels (copy these):
#   ubuntu-latest              linux x86_64
#   ubuntu-latest-arm64-s      linux arm64 (Arm-Limited managed, native)
#   windows-latest             windows x86_64
#   windows-latest-arm64-s     windows arm64 (custom runner lab, native)
#   macos-14                   macos aarch64
#
# rustc is workspace MSRV 1.88.0. fail-fast is false so one platform does
# not hide another. Pin stays contract: agent-wait/v0 at
# f1912957cde19b2b1e7809e430cc28dc417287cc.
#
# Timing-sensitive portable cancel tests are re-run with --test-threads=1.
# The rest of the suite stays parallel.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            fmt: true
          - name: linux-arm64
            runner: ubuntu-latest-arm64-s
            fmt: false
          - name: windows-x86_64
            runner: windows-latest
            fmt: false
          - name: windows-arm64
            runner: windows-latest-arm64-s
            fmt: false
          - name: macos-aarch64
            runner: macos-14
            fmt: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Format
        if: matrix.fmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Timing-sensitive portable cancel
        run: cargo test --locked -p waitprims-async portable_cancel -- --test-threads=1
