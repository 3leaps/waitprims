# waitprims read-only release artifacts
#
# On a v* tag, build unsigned CLI archives for the platforms this repo
# already smokes, and stage SBOM + licenses as workflow artifacts.
# CI holds no signing or release authority. The trusted maintainer ceremony
# independently verifies the signed tag, creates the draft and publishes.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      object: ${{ steps.identity.outputs.object }}
      commit: ${{ steps.identity.outputs.commit }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Restore and verify signed annotated tag
        id: identity
        env:
          WAITPRIMS_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./scripts/release-restore-tag-ref.sh
          ./scripts/verify-pinned-tag.sh
          object=$(git rev-parse "refs/tags/$WAITPRIMS_RELEASE_TAG")
          commit=$(git rev-parse "refs/tags/$WAITPRIMS_RELEASE_TAG^{}")
          echo "object=$object" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          printf '{"tag":"%s","object":"%s","commit":"%s"}\n' "$WAITPRIMS_RELEASE_TAG" "$object" "$commit" > release-identity.json

      - name: Upload artifact identity and licenses
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-identity
          if-no-files-found: error
          retention-days: 30
          path: |
            release-identity.json
            LICENSE-MIT
            LICENSE-APACHE

      - name: Validate VERSION matches tag
        id: version
        run: |
          set -euo pipefail
          WAITPRIMS_RELEASE_TAG="$GITHUB_REF_NAME" \
            WAITPRIMS_REQUIRE_TAG=1 \
            ./scripts/release-guard-tag-version.sh
          FILE_VERSION=$(tr -d ' \t\r\n' < VERSION)
          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check version consistency
        run: ./scripts/check-version.sh

  package-check:
    name: Package Check
    needs: validate-version
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.validate-version.outputs.commit }}

      - name: Confirm annotated tag identity
        env:
          WAITPRIMS_RELEASE_TAG: ${{ github.ref_name }}
          WAITPRIMS_EXPECTED_TAG_OBJECT: ${{ needs.validate-version.outputs.object }}
          EXPECTED_COMMIT: ${{ needs.validate-version.outputs.commit }}
        run: |
          ./scripts/release-restore-tag-ref.sh
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # reviewed 2026-08-05 commit
        with:
          toolchain: 1.88.0

      - name: Verify crates package (does not publish)
        run: ./scripts/check-packages.sh

  build-cli:
    name: Build CLI (${{ matrix.artifact_suffix }})
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-amd64
            archive: tar.gz
          - runner: ubuntu-latest-arm64-s
            target: aarch64-unknown-linux-gnu
            artifact_suffix: linux-arm64
            archive: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact_suffix: darwin-arm64
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: windows-amd64
            archive: zip
          - runner: windows-latest-arm64-s
            target: aarch64-pc-windows-msvc
            artifact_suffix: windows-arm64
            archive: zip
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.validate-version.outputs.commit }}

      - name: Confirm annotated tag identity
        env:
          WAITPRIMS_RELEASE_TAG: ${{ github.ref_name }}
          WAITPRIMS_EXPECTED_TAG_OBJECT: ${{ needs.validate-version.outputs.object }}
          EXPECTED_COMMIT: ${{ needs.validate-version.outputs.commit }}
        run: |
          ./scripts/release-restore-tag-ref.sh
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # reviewed 2026-08-05 commit
        with:
          toolchain: 1.88.0

      - name: Verify native host
        run: |
          set -euo pipefail
          host=$(rustc -vV | awk '/^host:/{print $2}')
          test "$host" = "${{ matrix.target }}"

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p waitprims-cli

      - name: Package CLI
        run: |
          set -euo pipefail
          version="${{ needs.validate-version.outputs.version }}"
          suffix="${{ matrix.artifact_suffix }}"
          mkdir -p dist/cli
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/waitprims.exe" dist/cli/waitprims.exe
            cp LICENSE-MIT LICENSE-APACHE dist/cli/
            powershell.exe -NoProfile -Command "Compress-Archive -Path dist/cli/* -DestinationPath waitprims-${version}-${suffix}.zip"
          else
            cp "target/${{ matrix.target }}/release/waitprims" dist/cli/waitprims
            cp LICENSE-MIT LICENSE-APACHE dist/cli/
            tar -czf "waitprims-${version}-${suffix}.tar.gz" -C dist/cli .
          fi

      - name: Upload CLI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.artifact_suffix }}
          if-no-files-found: error
          retention-days: 30
          path: waitprims-${{ needs.validate-version.outputs.version }}-${{ matrix.artifact_suffix }}.${{ matrix.archive }}

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fulmenhq/sbom-tools@sha256:8bb11cbcb77382d32c03f59e4ed7b9bdfc6b64bf549b43dc6be6db66b6586689
      options: --user 1001
    needs: validate-version
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.validate-version.outputs.commit }}

      - name: Confirm annotated tag identity
        env:
          WAITPRIMS_RELEASE_TAG: ${{ github.ref_name }}
          WAITPRIMS_EXPECTED_TAG_OBJECT: ${{ needs.validate-version.outputs.object }}
          EXPECTED_COMMIT: ${{ needs.validate-version.outputs.commit }}
        run: |
          ./scripts/release-restore-tag-ref.sh
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Generate SBOM (CycloneDX)
        run: syft dir:. -o cyclonedx-json > sbom-${{ needs.validate-version.outputs.version }}.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          if-no-files-found: error
          retention-days: 30
          path: sbom-${{ needs.validate-version.outputs.version }}.cdx.json
