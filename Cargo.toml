[workspace]
resolver = "2"
members = [
    "crates/waitprims-core",
    "crates/waitprims-async",
    "crates/waitprims-testkit",
    "crates/waitprims-cli",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/3leaps/waitprims"
homepage = "https://github.com/3leaps/waitprims"
authors = ["3leaps Architecture Council"]
publish = false

[workspace.dependencies]
waitprims-core = { version = "0.1.2", path = "crates/waitprims-core" }
waitprims-async = { version = "0.1.2", path = "crates/waitprims-async" }
waitprims-testkit = { version = "0.1.2", path = "crates/waitprims-testkit" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
sha2 = "0.10"
ryu-js = "1.0"
jsonschema = { version = "0.30", default-features = false }

tokio = { version = "1", default-features = false, features = ["rt", "time", "macros", "sync"] }

clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
